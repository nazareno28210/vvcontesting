<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <div class="login-container">
        
        <!-- Vista de Login -->
        <div id="loginSection">
            <div class="login-header">
                <h1>Iniciar Sesión</h1>
                <p>Ingresa tu correo y contraseña para acceder</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-login">Ingresar</button>
            </form>

            <div id="alertMessage" class="alert-message"></div>

            <div class="login-footer">
                <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
            </div>
        </div>

        <!-- Vista de Bienvenida (se muestra tras iniciar sesión) -->
        <div id="welcomeSection" class="welcome-container" style="display: none;">
            <h1 class="welcome-title">Bienvenido, <span id="userNameDisplay">Usuario</span></h1>
            <p class="welcome-subtitle">Has iniciado sesión correctamente.</p>
            <button id="logoutBtn" type="button" class="btn-logout">Cerrar Sesión</button>
        </div>

    </div>

    <script src="js/login.js"></script>
</body>
</html>
